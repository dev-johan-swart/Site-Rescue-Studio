name: Site Rescue Studio One-Batch Safety Test

on:
  # One controlled preflight at 00:05 SAST on 10 October 2026, ahead of
  # the regular production worker at 00:17 SAST. The date guard below makes
  # this a one-night test even though GitHub schedules are recurring.
  schedule:
    - cron: "5 22 * * *"
  push:
    paths:
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/one-batch-safety-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: srs-one-batch-safety-test
  cancel-in-progress: false

jobs:
  test-and-one-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automation unit tests
        run: npm run test:automation

      - name: Guard the one-night production test window
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "Push-triggered validation only. No production batch will be invoked."
            echo "invoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sast_date="$(TZ=Africa/Johannesburg date +%F)"
          sast_time="$(TZ=Africa/Johannesburg date +%H%M)"
          echo "SAST date: $sast_date; SAST time: $sast_time"

          if [ "$sast_date" != "2026-10-10" ]; then
            echo "This is a one-night test for 10 October 2026 only. No production batch invoked."
            echo "invoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$sast_time" -lt 0 ] || [ "$sast_time" -ge 730 ]; then
            echo "Outside the production window (00:00-07:29 SAST). No production batch invoked."
            echo "invoke=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "invoke=true" >> "$GITHUB_OUTPUT"

      - name: Invoke exactly production batch 1
        if: steps.guard.outputs.invoke == 'true'
        env:
          CRON_SECRET: ${{ secrets.SRS_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"

          response_file="$RUNNER_TEMP/safety-test-response.json"
          if http_status="$(curl \
            --connect-timeout 15 --max-time 330 \
            --fail-with-body --show-error --silent \
            --output "$response_file" --write-out '%{http_code}' \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Cache-Control: no-cache" \
            "https://site-rescue-studio.vercel.app/api/automation/run?batch=1")"; then
            curl_status=0
          else
            curl_status=$?
          fi

          cat "$response_file"
          echo "HTTP_STATUS:$http_status"
          if [ "$curl_status" -ne 0 ] || [ "$http_status" != "200" ]; then
            echo "::error::Safety-test batch request failed at transport/HTTP level; no automatic retry is made to avoid duplicate production work."
            exit 1
          fi
          jq -e '
            (.success == true) and
            (.fatalStage == null) and
            (.productionWindowClosed != true) and
            (.runId != null) and
            (.counts.scannedCount | type == "number")
          ' "$response_file" >/dev/null
          response="$(cat "$response_file")"

          scanned="$(printf '%s' "$response" | jq -r '.counts.scannedCount // 0')"
          candidates="$(printf '%s' "$response" | jq -r '.counts.candidateCount // 0')"
          errors="$(printf '%s' "$response" | jq -r '.errorSummary // empty')"
          echo "Test batch candidates: $candidates; scans completed: $scanned"
          if [ -n "$errors" ]; then
            echo "::warning::Batch returned an error summary: $errors"
          fi
          if [ "$scanned" -lt 1 ]; then
            echo "::error::The endpoint responded, but no scan completed. Inspect Neon run telemetry before relying on tonight's cycle."
            exit 1
          fi
          echo "At least one scan completed in the controlled production-path test."
