name: Overture Gauteng source audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - fix/discovery-supply-readiness-110-v2
    paths:
      - "scripts/audit-overture-gauteng.py"
      - "scripts/test_audit_overture_gauteng.py"
      - ".github/workflows/overture-gauteng-audit.yml"

permissions:
  contents: write

concurrency:
  group: overture-gauteng-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test strict source and license filters
        run: |
          python -m unittest discover -s scripts -p "test_audit_overture_gauteng.py" -v

      - name: Install Overture's official Python client
        run: python -m pip install --no-cache-dir overturemaps

      - name: Download Gauteng Places extract (read-only)
        run: |
          overturemaps download \
            --bbox=27.0,-26.5,29.0,-24.5 \
            --type=place \
            -f geojsonseq \
            -o "$RUNNER_TEMP/gauteng-places.geojsonseq"

      - name: Audit and export deduplicated candidate feed
        run: |
          python scripts/audit-overture-gauteng.py \
            "$RUNNER_TEMP/gauteng-places.geojsonseq" \
            --export "$RUNNER_TEMP/gauteng-places.jsonl.gz" \
            --summary "$RUNNER_TEMP/overture-summary.json"

      - name: Upload read-only candidate feed for review
        uses: actions/upload-artifact@v4
        with:
          name: overture-gauteng-candidates-${{ github.sha }}
          path: "${{ runner.temp }}/gauteng-places.jsonl.gz"
          if-no-files-found: error
          retention-days: 1

      - name: Check out public Overture data branch
        uses: actions/checkout@v4
        with:
          ref: overture-data
          path: overture-data
          persist-credentials: true

      - name: Publish licensed Gauteng feed snapshot
        env:
          OVERTURE_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/gauteng-places.jsonl.gz" overture-data/gauteng-places.jsonl.gz
          python - <<'PY'
          import importlib.metadata, json, os
          from datetime import datetime, timezone
          with open(os.path.join(os.environ["RUNNER_TEMP"], "overture-summary.json"), encoding="utf-8") as stream:
              summary = json.load(stream)
          metadata = {
              "source": "Overture Maps Places",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "overturemaps_client_version": importlib.metadata.version("overturemaps"),
              "region": "Gauteng, South Africa",
              "bbox": [27.0, -26.5, 29.0, -24.5],
              "format": "gzip-compressed JSON Lines",
              "candidate_count": summary["exported_unique_website_hosts"],
              "eligible_source_counts": summary["eligible_source_counts"],
              "eligible_category_counts": summary["eligible_category_counts"],
              "filters": [
                  "country ZA and Gauteng region aliases only",
                  "business name and website required",
                  "confidence >= 0.7",
                  "Foursquare-sourced records excluded",
                  "source licence must be CDLA-Permissive-2.0 or CC0-1.0",
                  "social, directory, parked and platform-hosted domains excluded",
                  "one record per unique website host",
                  "no phone numbers or email addresses exported"
              ],
              "source_commit": os.environ["OVERTURE_SOURCE_COMMIT"],
              "licenses": [
                  "https://cdla.dev/permissive-2-0/",
                  "https://creativecommons.org/publicdomain/zero/1.0/"
              ]
          }
          with open("overture-data/metadata.json", "w", encoding="utf-8") as stream:
              json.dump(metadata, stream, ensure_ascii=False, indent=2)
          PY
          cat > overture-data/NOTICE.md <<'EOF'
          # Overture Gauteng Places feed

          This feed is derived from the Overture Maps Places theme. It contains
          business names, public website URLs, city/region, category, confidence,
          GERS feature IDs, and per-record source/license provenance. It does not
          contain phone numbers or email addresses.

          Records are included only when their source provenance is explicitly
          licensed under CDLA-Permissive-2.0 or CC0-1.0. Any record with a
          Foursquare source is excluded. The underlying source datasets and
          licences are retained in each record's locationEvidence.sources.

          - Overture Maps attribution: https://overturemaps.org/
          - CDLA-Permissive-2.0: https://cdla.dev/permissive-2-0/
          - CC0-1.0: https://creativecommons.org/publicdomain/zero/1.0/

          This is a candidate feed, not a verified prospect list. Consumers must
          deduplicate against their own records and perform DNS, live homepage,
          parked-domain, identity and geography checks before use.
          EOF
          git -C overture-data config user.name "github-actions[bot]"
          git -C overture-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C overture-data add gauteng-places.jsonl.gz metadata.json NOTICE.md
          if git -C overture-data diff --cached --quiet; then
            echo "Overture feed unchanged; no data branch commit required."
          else
            git -C overture-data commit -m "Refresh licensed Gauteng Overture Places feed"
            git -C overture-data push origin HEAD:overture-data
          fi
