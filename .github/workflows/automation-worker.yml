name: Site Rescue Studio Automation Worker

on:
  schedule:
    # 02:00 SAST preparation: discovery only, no scans.
    - cron: "0 0 * * *"
    # 03:00-06:40 SAST: twelve 5-site worker opportunities.
    # 12 x 5 = 60 scan slots, leaving 10 slots of headroom for the 50-site target.
    - cron: "0,20,40 1-6 * * *"
  workflow_dispatch:

jobs:
  run-automation:
    concurrency:
      group: site-rescue-studio-automation-worker
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Invoke production automation worker
        env:
          CRON_SECRET: ${{ secrets.SRS_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent             --request GET             --header "Authorization: Bearer $CRON_SECRET"             --header "Cache-Control: no-cache"             "https://site-rescue-studio.vercel.app/api/automation/run"
      - name: Note
        run: echo "Production automation worker invoked."
