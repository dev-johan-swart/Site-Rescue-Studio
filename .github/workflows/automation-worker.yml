name: Site Rescue Studio Automation Worker

on:
  schedule:
    # Multiple off-hour wake-up opportunities reduce the chance that a single
    # delayed/dropped GitHub schedule prevents the daily production cycle.
    # The first successful workflow run executes all 12 production opportunities
    # sequentially; later wake-ups become no-ops once the 50-site target is met.
    - cron: "7 0 * * *"
    - cron: "7 1 * * *"
    - cron: "7 2 * * *"
    - cron: "7 3 * * *"
    - cron: "7 4 * * *"
  workflow_dispatch:

concurrency:
  group: site-rescue-studio-automation-worker
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Invoke production automation batches sequentially
        env:
          CRON_SECRET: ${{ secrets.SRS_CRON_SECRET }}
        timeout-minutes: 55
        run: |
          set -u
          test -n "$CRON_SECRET"

          failures=0

          for batch in $(seq 1 12); do
            echo "=== Starting production batch $batch/12 ==="

            response="$(curl               --retry 2               --retry-delay 5               --retry-all-errors               --max-time 330               --fail-with-body               --show-error               --silent               --request GET               --header "Authorization: Bearer $CRON_SECRET"               --header "Cache-Control: no-cache"               --write-out '\nHTTP_STATUS:%{http_code}\n'               "https://site-rescue-studio.vercel.app/api/automation/run?batch=$batch" 2>&1)"
            curl_status=$?

            echo "$response"

            if [ "$curl_status" -ne 0 ]; then
              echo "::warning::Production batch $batch invocation returned curl status $curl_status. Continuing to the next batch opportunity."
              failures=$((failures + 1))
            fi

            echo "=== Finished production batch $batch/12 ==="
          done

          if [ "$failures" -gt 0 ]; then
            echo "::warning::$failures production batch invocation(s) returned transport errors. Review the Neon automation run telemetry; later batches were still attempted."
          fi

          echo "Sequential production opportunity loop finished. The Neon daily target remains the source of truth.";
