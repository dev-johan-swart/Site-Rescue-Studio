name: Site Rescue Studio Discovery Preparation

on:
  schedule:
    # Continuous supply-chain check every 20 minutes. The endpoint exits
    # immediately when the fresh queue is already at the 110-site target.
    # Production closes at 07:30 SAST (05:30 UTC). Discovery gets the daytime gap
    # plus the final pre-production refill window, but does not compete with production.
    - cron: "40 5 * * *"
    - cron: "0,20,40 6-23 * * *"
    - cron: "0,20,40 0-1 * * *"
  workflow_dispatch:

jobs:
  prepare-discovery:
    concurrency:
      group: site-rescue-studio-discovery-preparation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check and top up the fresh 110-site reserve
        env:
          CRON_SECRET: ${{ secrets.SRS_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --show-error --silent             --connect-timeout 15 --max-time 240 \
            --request GET             --header "Authorization: Bearer $CRON_SECRET"             --header "Cache-Control: no-cache"             "https://site-rescue-studio.vercel.app/api/automation/run?mode=prepare"
