name: Site Rescue Studio Discovery Preparation

on:
  schedule:
    # Run every 20 minutes across the full day, including the entire
    # 03:05-06:45 SAST production window, so fresh reserve can replenish
    # while workers consume it. The endpoint exits immediately at the
    # 110-site fresh reserve target. GitHub schedule delivery is best-effort;
    # the separate external dispatch remains an additional trigger.
    - cron: "*/20 * * * *"
  workflow_dispatch:
  # The existing external scheduler dispatches the 12 worker batches. Run a
  # reserve top-up after each completed production batch so discovery remains
  # coupled to the proven external schedule without changing any worker jobs.
  workflow_run:
    workflows:
      - "Site Rescue Studio Automation Worker"
    types:
      - completed
    branches:
      - main

jobs:
  prepare-discovery:
    concurrency:
      group: site-rescue-studio-discovery-preparation
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check and top up the fresh 110-site reserve
        env:
          CRON_SECRET: ${{ secrets.SRS_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          response_file="$RUNNER_TEMP/discovery-preparation.json"
          curl --fail-with-body --show-error --silent \
            --connect-timeout 15 --max-time 240 \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Cache-Control: no-cache" \
            --output "$response_file" \
            "https://site-rescue-studio.vercel.app/api/automation/run?mode=prepare"
          cat "$response_file"
          echo
          queue_depth="$(jq -r '.queueDepth // 0' "$response_file")"
          target="$(jq -r '.target // 110' "$response_file")"
          target_reached="$(jq -r '.targetReached // false' "$response_file")"
          echo "DISCOVERY_RESERVE:$queue_depth/$target TARGET_REACHED:$target_reached"
          if [ "$queue_depth" -eq 0 ]; then
            echo "::error::Discovery preparation returned a zero fresh-prospect reserve. Investigate provider availability and queue/backlog diagnostics immediately."
            exit 1
          elif [ "$target_reached" != "true" ]; then
            echo "::warning::Discovery reserve remains below target: $queue_depth/$target fresh prospects."
          fi