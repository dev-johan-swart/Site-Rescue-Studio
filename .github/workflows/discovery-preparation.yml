name: Site Rescue Studio Discovery Preparation

on:
  schedule:
    # Build reserve before and throughout the 03:05-06:45 SAST production
    # window. Run every 20 minutes at :15, :35 and :55 UTC to avoid the
    # GitHub Actions top-of-hour scheduling congestion window.
    # Preserve the existing 07:40 SAST recovery slot (05:40 UTC).
    # No worker-completion trigger or provider budget increase.
    - cron: "15,35,55 22-23 * * *"
    - cron: "15,35 0 * * *"
    - cron: "55 0 * * *"
    - cron: "15,35,55 1-3 * * *"
    - cron: "15 4 * * *"
    - cron: "35 4 * * *"
    - cron: "15,35,55 6-21 * * *"
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate external scheduler delivery without calling production"
        required: false
        type: boolean
        default: false

jobs:
  prepare-discovery:
    concurrency:
      group: site-rescue-studio-discovery-preparation
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Confirm safe external dispatch
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "SAFE_EXTERNAL_DISPATCH_CONFIRMED"
          echo "No Vercel endpoint, Neon table, provider budget, queue, or scan was touched."
          {
            echo "### Safe external dispatch test"
            echo "- Dispatch accepted by GitHub Actions."
            echo "- Production preparation was not executed."
            echo "- No Neon, provider, queue, or scan data was touched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check and top up the fresh 110-site reserve
        if: ${{ inputs.dry_run != true }}
        env:
          CRON_SECRET: ${{ secrets.SRS_CRON_SECRET }}
          STRICT_READINESS: ${{ github.event.schedule == '55 0 * * *' }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          response_file="$RUNNER_TEMP/discovery-preparation.json"
          endpoint="https://site-rescue-studio.vercel.app/api/automation/run?mode=prepare"
          if [ "$STRICT_READINESS" = "true" ]; then endpoint="$endpoint&strict=true"; fi
          curl --fail-with-body --show-error --silent \
            --connect-timeout 15 --max-time 240 \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Cache-Control: no-cache" \
            --output "$response_file" \
            "$endpoint"
          cat "$response_file"
          echo
          jq -e '.success == true and (.queueDepth | type == "number") and (.target | type == "number") and (.attempts | type == "array")' "$response_file" >/dev/null
          queue_depth="$(jq -r '.queueDepth' "$response_file")"
          target="$(jq -r '.target' "$response_file")"
          target_reached="$(jq -r '.targetReached // false' "$response_file")"
          readiness_gate="$(jq -r '.readinessGate // "not_requested"' "$response_file")"
          preparation_run_id="$(jq -r '.preparationRunId // "not-recorded"' "$response_file")"
          supply_status="$(jq -r '.supplyStatus // "unknown"' "$response_file")"
          daily_qualified="$(jq -r '.dailyQualifiedProspects // 0' "$response_file")"
          daily_qualified_target="$(jq -r '.dailyQualifiedTarget // 60' "$response_file")"
          attempts="$(jq -r '.attempts | length' "$response_file")"
          discovered="$(jq '[.attempts[].backlogDiagnostics.added // 0] | add // 0' "$response_file")"
          promoted="$(jq '[.attempts[].newlyQueued // 0] | add // 0' "$response_file")"
          echo "DISCOVERY_RESERVE:$queue_depth/$target TARGET_REACHED:$target_reached READINESS_GATE:$readiness_gate STRICT:$STRICT_READINESS SUPPLY_STATUS:$supply_status"
          {
            echo "### Discovery preparation"
            echo "- Fresh reserve: $queue_depth/$target"
            echo "- Supply status: $supply_status"
            echo "- New qualified prospects today: $daily_qualified/$daily_qualified_target"
            echo "- Preparation attempts: $attempts"
            echo "- Readiness gate: $readiness_gate"
            echo "- Durable preparation run: $preparation_run_id"
            echo "- New backlog records: $discovered"
            echo "- Newly promoted queue items: $promoted"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$target" -ne 110 ]; then
            echo "::error::Discovery preparation reported an unexpected reserve target: $target (expected 110)."
            exit 1
          elif [ "$queue_depth" -lt 60 ]; then
            echo "::error::Discovery reserve is critical at $queue_depth/$target. Investigate provider yield, qualification, backlog promotion and scheduling."
            exit 1
          fi
          if [ "$daily_qualified" -lt "$daily_qualified_target" ]; then
            echo "::warning::Daily qualified discovery yield is below target: $daily_qualified/$daily_qualified_target. Review provider freshness and qualification diagnostics."
          fi
          if [ "$target_reached" != "true" ]; then
            if [ "$STRICT_READINESS" = "true" ]; then
              echo "::error::Strict reserve readiness failed: $queue_depth/$target. The production worker will remain paused until a preparation run proves 110/110."
              exit 1
            fi
            echo "::warning::Discovery reserve remains below target: $queue_depth/$target fresh prospects."
          elif [ "$STRICT_READINESS" = "true" ] && [ "$readiness_gate" != "passed" ]; then
            echo "::error::Strict readiness was requested but the API did not confirm the 110/110 gate."
            exit 1
          fi