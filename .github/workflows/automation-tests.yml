name: Site Rescue Studio Automation Tests

on:
  push:
    branches:
      - fix/mycityinfo-gauteng-routes
      - fix/local-discovery-core-provider-rotation
      - fix/discovery-source-efficiency-nov16
      - fix/restore-discovery-supply-cadence
      - fix/discovery-provenance-and-map-link-filtering
      - fix/discovery-supply-readiness-110-v2
  pull_request:
    branches:
      - main
    paths:
      - "lib/**"
      - "api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/automation-tests.yml"

permissions:
  contents: read

jobs:
  automation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete automation regression suite
        run: npm run test:automation
      - name: Verify isolated Preview database target (read-only)
        if: github.ref == 'refs/heads/fix/discovery-supply-readiness-110-v2'
        env:
          STAGING_CRON_SECRET: ${{ secrets.SRS_STAGING_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$STAGING_CRON_SECRET" || { echo "::error::SRS_STAGING_CRON_SECRET is not configured."; exit 1; }
          response_file="$RUNNER_TEMP/preview-diagnostics.json"
          curl --fail-with-body --show-error --silent \
            --connect-timeout 15 --max-time 30 \
            --request GET \
            --header "Authorization: Bearer $STAGING_CRON_SECRET" \
            --header "Cache-Control: no-cache" \
            --output "$response_file" \
            "https://site-rescue-studio-bf3hooldl-johan-swarts-projects-3a10b731.vercel.app/api/automation/run?mode=diagnostics"
          cat "$response_file"
          jq -e '
            .success == true and
            .diagnosticsOnly == true and
            .databaseHost == "ep-damp-pine-zazcgesz.c-2.eu-west-2.aws.neon.tech" and
            .connectedDatabaseName == .configuredDatabaseName and
            .deploymentCommit == "42599febd73142b6657309905c2fa4a2ad72cbec"
          ' "$response_file" >/dev/null
          echo "PREVIEW_DATABASE_TARGET_VERIFIED: isolated Neon staging branch"
